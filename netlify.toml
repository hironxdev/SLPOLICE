[build]
  # Navigate to the frontend folder
  base = "court-frontend"
  
  # Run the build command
  command = "npm run build"
  
  # The directory Next.js builds into (relative to the base)
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "true"

[[plugins]]
  # This tells Netlify to use the specialized Next.js runtime
  package = "@netlify/plugin-nextjs"
